<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar FRL 2026</title>
<link rel="preload" href="/static/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<header class="bar">
  <img src="/static/brand/cbr-petrobras.png" alt="Competição Brasileira de Robótica 2026 com Petrobras">
  <nav id="nav"><a class="btn primary" href="/login">Entrar</a></nav>
</header>
<main class="hero">
  <span class="eyebrow">CBR 2026 · RoboCup Brasil</span>
  <h1>Flying Robots League</h1>
  <p>Acompanhe ao vivo quem está voando, o tempo restante e a classificação geral. Árbitros e operadores entram para controlar o placar.</p>
  <div class="actions">
    <a class="btn primary" href="/tv">Ver placar ao vivo</a>
    <a class="btn ghost" id="ctl" href="/login">Entrar como operador</a>
  </div>
</main>
<footer class="sponsors"><img src="/static/brand/patrocinio.png" alt="Realização e patrocínio"></footer>
<script>
fetch("/api/me", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
  if (!d.user) return;
  document.getElementById("ctl").textContent = "Abrir controle";
  document.getElementById("ctl").href = "/controle";
  var nav = document.getElementById("nav");
  nav.innerHTML = '<span class="who"></span><form method="post" action="/logout"><button class="small" type="submit">Sair</button></form>';
  nav.firstChild.textContent = d.user.username;
}).catch(function () {});
</script>
</body>
</html>
