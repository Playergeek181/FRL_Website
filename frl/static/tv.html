<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRL 2026 - Placar</title>
<link rel="preload" href="/static/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/tv.css">
</head>
<body>
<div id="offline" hidden>Sem conexão com o servidor</div>
<header id="top">
  <div class="brand">
  <img class="cbr" src="/static/brand/cbr.png" alt="Competição Brasileira de Robótica">
  <h1 class="mark">
    <svg viewBox="0 0 24 24" width="1.25em" height="1.25em" aria-hidden="true">
      <circle cx="5" cy="5" r="3.2" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="19" cy="5" r="3.2" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="5" cy="19" r="3.2" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="19" cy="19" r="3.2" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="var(--accent)" stroke-width="2"/>
      <rect x="9.5" y="9.5" width="5" height="5" rx="1" fill="var(--accent)"/>
    </svg>
    Flying Robots League 2026
  </h1>
  </div>
  <ol id="phases" aria-label="Fases"></ol>
</header>
<main id="tv">
  <section id="arena" class="card" aria-labelledby="arena-h">
    <h2 id="arena-h" class="card-h">Na arena</h2>
    <div id="arena-body" class="arena-body"></div>
  </section>
  <section id="queue" class="card" aria-labelledby="queue-h">
    <h2 id="queue-h" class="card-h">Próximas equipes</h2>
    <ol id="queue-list"></ol>
  </section>
  <section id="standings" class="card" aria-labelledby="rank-h">
    <h2 id="rank-h" class="card-h">Classificação geral <span class="card-sub">pontos de ranking por fase</span></h2>
    <table id="rank">
      <thead><tr><th class="pos">#</th><th class="lg"></th><th class="name">Equipe</th><th class="ph" data-p="1">F1</th><th class="ph" data-p="2">F2</th><th class="ph" data-p="3">F3</th><th class="ph" data-p="4">F4</th><th class="total">Total</th></tr></thead>
      <tbody id="rank-body"></tbody>
    </table>
  </section>
</main>
<footer id="sponsors">
  <img src="/static/brand/patrocinio.png" alt="Organização: RoboCup Brasil, SBC, Instituto Federal do Rio Grande do Norte, Governo da Paraíba. Apoio: RoboCup, RoboCup Junior, MNR, Competição Brasileira de Robótica, OBR. Patrocínio: Infineon, Fundação Behring, CNPq, Petrobras, Ministério da Educação, Ministério da Ciência, Tecnologia e Inovação, Governo Federal.">
</footer>
<script src="/static/tv.js"></script>
</body>
</html>
